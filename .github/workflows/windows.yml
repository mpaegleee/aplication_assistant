name: Validar e empacotar Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Compilar e testar
        shell: pwsh
        run: ./packaging/build-windows.ps1
      - name: Gerar instalador
        shell: pwsh
        run: '& "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" packaging/installer.iss'
      - name: Testar instalação e atualização com dados preservados
        shell: pwsh
        env:
          PYTHONPATH: backend
        run: ./.venv/Scripts/python.exe packaging/test_upgrade.py windows dist/ApplicationAssistant-Setup-0.6.3-Windows-x64.exe 0.6.3
      - uses: actions/upload-artifact@v4
        with:
          name: ApplicationAssistant-Windows-0.6.3
          path: dist/ApplicationAssistant-Setup-0.6.3-Windows-x64.exe
          retention-days: 14
